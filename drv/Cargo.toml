[package]
name = "drv"
version = "0.1.0"
authors = ["Martin Algesten <martin@algesten.se>"]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/algesten/drv"
homepage = "https://github.com/algesten/drv"
description = "Memoized derivations over plain Rust structs"
readme = "../README.md"
keywords = ["memoization", "incremental", "derive", "lens", "reactive"]
categories = ["caching", "data-structures", "rust-patterns"]

[dependencies]
drv-macros = { version = "=0.1.0", path = "../drv-macros" }

[dev-dependencies]
imbl = "7.0.0"
